name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Not blocking until the suite is stable on Linux. Visual baselines exist only
  # for macOS (*-darwin.png), so screenshot assertions are skipped here.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test --ignore-snapshots

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Builds the production image without publishing it (that comes with S8.2)
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t faclab-web:ci .

      - name: Refuse to start without API URLs
        run: |
          if docker run --rm faclab-web:ci > startup.log 2>&1; then
            echo "The image started without API_BASE_URL and INVOICING_API_URL"
            exit 1
          fi
          cat startup.log
          grep -q 'API_BASE_URL is required' startup.log

      - name: Serve the SPA with runtime settings
        run: |
          docker run -d --name web -p 8080:8080 \
            -e API_BASE_URL=https://api.example.test \
            -e INVOICING_API_URL=https://invoicing.example.test \
            faclab-web:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/health > /dev/null && break
            sleep 1
          done
          docker logs web
          curl -fsS http://localhost:8080/pos | grep -q 'id="root"'
          curl -fsS http://localhost:8080/config.js | grep -q '"apiBaseUrl":"https://api.example.test"'
          curl -fsSI http://localhost:8080/config.js | grep -qi '^cache-control: no-store'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.js)" = 404
